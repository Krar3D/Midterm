<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات الاقتصاد الذكية 🧠</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 16px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .brand { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .header-controls { display: flex; gap: 15px; font-size: 1.2rem; }
        .header-controls i { cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .header-controls i:hover { color: var(--text-main); }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
        }

        /* Views */
        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Home View */
        .page-title { text-align: center; margin-bottom: 30px; font-weight: 800; font-size: 1.8rem; background: -webkit-linear-gradient(right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--primary); }
        
        .card h3 { font-size: 1.2rem; margin-bottom: 10px; }
        .card .stats { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
        
        .btn-mixed {
            display: block; width: 100%; padding: 15px; margin-top: 30px; background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white; border: none; border-radius: var(--radius); font-size: 1.2rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: transform 0.2s; text-align: center;
        }
        .btn-mixed:active { transform: scale(0.98); }

        /* Setup View */
        .setup-box { background: var(--bg-card); padding: 30px; border-radius: var(--radius); text-align: center; }
        .setup-opt { margin: 20px 0; }
        .setup-opt label { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; cursor: pointer; }
        .setup-opt input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); }
        
        .btn-start { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-size: 1.2rem; font-weight: 700; margin-top: 30px; cursor: pointer; }

        /* Quiz View */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .progress-container { flex-grow: 1; height: 8px; background: var(--border); border-radius: 4px; margin: 0 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .q-counter { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        
        .timer { display: none; font-family: monospace; font-size: 1.2rem; color: var(--warning); font-weight: bold; }
        .streak-box { display: flex; align-items: center; gap: 5px; color: var(--warning); font-weight: bold; }

        .question-box { background: var(--bg-card); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; position: relative; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.5; }
        
        .bookmark-btn { position: absolute; top: 15px; left: 15px; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .bookmark-btn.active { color: var(--warning); }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(255,255,255,0.03); border: 2px solid var(--border); padding: 15px 20px; border-radius: 12px;
            cursor: pointer; font-size: 1.1rem; transition: all 0.2s; display: flex; align-items: center; gap: 15px;
        }
        .option:hover:not(.disabled) { border-color: var(--primary); background: rgba(59,130,246,0.05); }
        .option.selected { border-color: var(--primary); background: rgba(59,130,246,0.1); }
        .option.correct { border-color: var(--success) !important; background: rgba(16,185,129,0.1) !important; color: var(--success); }
        .option.wrong { border-color: var(--danger) !important; background: rgba(239,68,68,0.1) !important; color: var(--danger); opacity: 0.7; }
        .option.disabled { pointer-events: none; }

        .opt-letter { background: var(--border); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; }
        .option.correct .opt-letter { background: var(--success); color: white; }
        .option.wrong .opt-letter { background: var(--danger); color: white; }

        .tools-bar { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-hint { background: transparent; color: var(--warning); border: 1px solid var(--warning); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-hint:hover { background: rgba(245, 158, 11, 0.1); }

        .feedback-box {
            margin-top: 20px; padding: 20px; border-radius: 12px; display: none; animation: fadeIn 0.3s;
        }
        .feedback-box.success { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: #a7f3d0; }
        .feedback-box.error { background: rgba(239,68,68,0.15); border: 1px solid var(--danger); color: #fecaca; }
        .feedback-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .feedback-expl { font-size: 1rem; line-height: 1.5; margin-top:10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        .btn-next {
            display: none; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: var(--radius);
            font-size: 1.2rem; font-weight: 700; margin-top: 20px; cursor: pointer;
        }

        /* Result View */
        .result-container { text-align: center; background: var(--bg-card); padding: 40px 20px; border-radius: var(--radius); border: 1px solid var(--border); }
        .circle-wrap { margin: 20px auto; width: 150px; height: 150px; background: conic-gradient(var(--primary) 0%, var(--border) 0%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .circle-wrap::before { content: ""; position: absolute; width: 120px; height: 120px; background: var(--bg-card); border-radius: 50%; }
        .circle-wrap .score-text { position: relative; font-size: 2rem; font-weight: 900; color: white; }
        
        .rank-title { font-size: 1.8rem; font-weight: 800; color: var(--warning); margin: 15px 0; }
        .rank-desc { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }
        
        .result-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; min-width: 100px; border: 1px solid var(--border); }
        .stat-box.g { border-color: var(--success); color: var(--success); }
        .stat-box.r { border-color: var(--danger); color: var(--danger); }
        .stat-num { font-size: 1.5rem; font-weight: bold; display: block; }
        .stat-lbl { font-size: 0.9rem; }

        .action-btns { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center;}
        .btn-blue { background: var(--primary); color: white; }
        .btn-blue:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: rgba(59,130,246,0.1); }
        .btn-green { background: var(--success); color: white; }
        
        /* Review View */
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .filter-wrong { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted); }
        .filter-wrong input { accent-color: var(--danger); width: 18px; height: 18px; }
        
        .review-item { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; border-left: 5px solid var(--success); }
        .review-item.wrong { border-left-color: var(--danger); }
        .review-q { font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; }
        .review-ans { margin-bottom: 8px; color: var(--text-muted); }
        .review-ans.correct-text { color: var(--success); font-weight: bold; }
        .review-ans.wrong-text { color: var(--danger); text-decoration: line-through; }
        
        #bookmarks-view h2 { margin-bottom: 10px; }

        /* MathJax Adjustments */
        mjx-container { text-align: right !important; display: inline-block !important; direction: ltr; }
        
        @media (max-width: 600px) {
            .setup-box { padding: 20px; }
            .action-btns { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="goHome()">
            <i class="fa-solid fa-graduation-cap"></i>
            بوابة الاقتصاد الذكية
        </div>
        <div class="header-controls">
            <i class="fa-solid fa-volume-high" id="soundToggle" onclick="toggleSound()" title="الصوت"></i>
            <i class="fa-solid fa-bookmark" onclick="showBookmarks()" title="المحفوظات"></i>
        </div>
    </header>

    <main>
        <!-- 1. Home View -->
        <div id="home-view" class="view active">
            <h1 class="page-title">اختبارات الاقتصاد -  </h1>
            <div class="grid" id="chapters-grid">
                <!-- Chapters injected here -->
            </div>
            <button class="btn-mixed" onclick="setupQuiz('all')">
                <i class="fa-solid fa-shuffle"></i> امتحان شامل (كل الفصول)
            </button>
        </div>

        <!-- 2. Setup View -->
        <div id="quiz-setup-view" class="view">
            <div class="setup-box">
                <h2 id="setup-title" style="margin-bottom: 20px; color: var(--primary);">إعدادات الاختبار</h2>
                
                <div class="setup-opt" style="margin-top: 30px;">
                    <label>
                        <input type="checkbox" id="timer-toggle">
                        <i class="fa-solid fa-stopwatch"></i> تفعيل المؤقت (30 ثانية للسؤال)
                    </label>
                </div>

                <div class="setup-opt">
                    <label>
                        <input type="checkbox" id="shuffle-toggle" checked>
                        <i class="fa-solid fa-random"></i> خلط الأسئلة والخيارات
                    </label>
                </div>

                <button class="btn-start" onclick="startQuiz()">ابدأ الاختبار 🚀</button>
                <button class="btn-outline" style="width:100%; margin-top:10px; padding:15px; border-radius:16px; border:none;" onclick="goBack()">رجوع</button>
            </div>
        </div>

        <!-- 3. Quiz View -->
        <div id="quiz-view" class="view">
            <div class="top-bar">
                <div class="q-counter" id="q-counter">السؤال 1 من 10</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="timer" id="timer">00:30</div>
                <div class="streak-box" id="streak-box" style="display:none;">
                    <i class="fa-solid fa-fire"></i> <span id="streak-count">3</span>
                </div>
            </div>

            <div class="question-box">
                <i class="fa-solid fa-bookmark bookmark-btn" id="btn-bookmark" onclick="toggleBookmark()"></i>
                <div class="question-text" id="question-text">نص السؤال هنا</div>
                
                <div class="options" id="options-container">
                    <!-- Options injected here -->
                </div>

                <div class="tools-bar" id="tools-bar">
                    <button class="btn-hint" id="btn-hint" onclick="showHint()"><i class="fa-solid fa-lightbulb"></i> تلميح</button>
                </div>

                <div class="feedback-box" id="feedback-box">
                    <div class="feedback-title" id="feedback-title"></div>
                    <div class="feedback-expl" id="feedback-expl"></div>
                </div>
            </div>

            <button class="btn-next" id="btn-next" onclick="nextQuestion()">التالي <i class="fa-solid fa-arrow-left"></i></button>
        </div>

        <!-- 4. Result View -->
        <div id="result-view" class="view">
            <div class="result-container">
                <h2 style="margin-bottom:10px;">انتهى الاختبار!</h2>
                
                <div class="circle-wrap" id="score-circle">
                    <span class="score-text" id="score-percent">0%</span>
                </div>

                <div class="rank-title" id="rank-title">لقب التحشيش</div>
                <div class="rank-desc" id="rank-desc">رسالة تحفيزية هنا</div>

                <div class="result-stats">
                    <div class="stat-box g">
                        <span class="stat-num" id="stat-correct">0</span>
                        <span class="stat-lbl">صح ✔️</span>
                    </div>
                    <div class="stat-box r">
                        <span class="stat-num" id="stat-wrong">0</span>
                        <span class="stat-lbl">غلط ❌</span>
                    </div>
                </div>

                <div class="action-btns">
                    <button class="btn btn-blue" onclick="showReview()"><i class="fa-solid fa-list-check"></i> مراجعة الأجوبة</button>
                    <button class="btn btn-outline" onclick="retryWrong()" id="btn-retry-wrong"><i class="fa-solid fa-rotate-left"></i> إعادة الأغلاط فقط</button>
                    <button class="btn btn-outline" onclick="startQuiz()"><i class="fa-solid fa-rotate"></i> إعادة الاختبار</button>
                    <button class="btn btn-green" onclick="shareResult()"><i class="fa-solid fa-share-nodes"></i> شارك النتيجة</button>
                    <button class="btn btn-outline" onclick="goHome(true)" style="border:none;"><i class="fa-solid fa-home"></i> الرئيسية</button>
                </div>
            </div>
        </div>

        <!-- 5. Review View -->
        <div id="review-view" class="view">
            <div class="review-header">
                <h2>مراجعة الأجوبة 📋</h2>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label class="filter-wrong">
                        <input type="checkbox" id="filter-wrong-cb" onchange="renderReview()">
                        عرض الأغلاط فقط
                    </label>
                    <button class="btn btn-outline" style="padding: 5px 15px; font-size: 0.9rem;" onclick="goBack()">رجوع</button>
                </div>
            </div>
            <div id="review-list"></div>
            <button class="btn btn-blue" style="width:100%; margin-top:20px;" onclick="goBack()">رجوع</button>
        </div>
        
        <!-- Bookmarks View -->
        <div id="bookmarks-view" class="view">
            <div class="review-header">
                <h2>المحفوظات ⭐</h2>
                <button class="btn btn-outline" style="padding: 5px 15px; font-size: 0.9rem;" onclick="goBack()">رجوع</button>
            </div>
            <p style="color:var(--text-muted); margin-bottom:20px;">الأسئلة اللي حفظتها حتى تراجعها بعدين.</p>
            <div id="bookmarks-list"></div>
            <button class="btn btn-blue" style="width:100%; margin-top:20px;" onclick="goBack()">رجوع</button>
        </div>

    </main>

    <script>

        const ALL_QUESTIONS = [{"id": 1, "chapter": 1, "question": "التعبير الاقتصادي العملي عن الاحتياجات البشرية هو:", "options": ["أ. العرض", "ب. الطلب", "ج. الاستهلاك", "د. الرغبة"], "correctIndex": 1}, {"id": 2, "chapter": 1, "question": "لكي يتحقق طلب فرد ما على سلعة معينة، يجب أن تقترن رغبته بـ:", "options": ["أ. توفر السلعة في السوق", "ب. انخفاض سعر السلعة", "ج. القدرة الشرائية", "د. الحاجة الماسة"], "correctIndex": 2}, {"id": 3, "chapter": 1, "question": "الشرط الذاتي لتحقق الطلب على سلعة معينة هو:", "options": ["أ. القدرة على الدفع", "ب. الرغبة", "ج. توفر البدائل", "د. السعر المناسب"], "correctIndex": 1}, {"id": 4, "chapter": 1, "question": "الشرط الموضوعي لتحقق الطلب على سلعة معينة هو:", "options": ["أ. الرغبة", "ب. القدرة على الدفع", "ج. أذواق المستهلكين", "د. توفر السلع المكملة"], "correctIndex": 1}, {"id": 5, "chapter": 1, "question": "المتغيرات التي لا يمكن قياسها كمياً ولكن يمكن ترتيبها حسب أهميتها تسمى المتغيرات:", "options": ["أ. التابعة", "ب. الخارجية", "ج. النوعية", "د. المستقلة"], "correctIndex": 2}, {"id": 6, "chapter": 1, "question": "التغير في أسعار السلع الاعتيادية يمارس تأثيراً على الكميات المطلوبة منها يصف بأنه:", "options": ["أ. تأثير طردي", "ب. تأثير عكسي", "ج. تأثير معدوم", "د. تأثير متذبذب"], "correctIndex": 1}, {"id": 7, "chapter": 1, "question": "تراجع رغبة الفرد بالحصول على وحدات إضافية من نفس السلعة بدءاً من الوحدة الثانية يفسره قانون:", "options": ["أ. العرض والطلب", "ب. تناقص الغلة", "ج. تناقص المنفعة الحدية", "د. تناقص التكاليف"], "correctIndex": 2}, {"id": 8, "chapter": 1, "question": "زيادة دخل المستهلك تؤدي عادة إلى زيادة الكميات المطلوبة من السلع الاعتيادية، مما يعني وجود علاقة:", "options": ["أ. عكسية", "ب. طردية", "ج. صفرية", "د. ثابتة"], "correctIndex": 1}, {"id": 9, "chapter": 1, "question": "السلع التي يقل طلب المستهلك عليها إذا ارتفع دخله (مثل الملابس المستعملة) تسمى:", "options": ["أ. السلع الكمالية", "ب. السلع البديلة", "ج. السلع المكملة", "د. السلع الرديئة"], "correctIndex": 3}, {"id": 10, "chapter": 1, "question":             44: "جيفين لاحظ انه الفقراء كلش، من يرخص الخبز، بدل ما يشترون خبز أكثر، يجمعون الباقي ويشترون لحم! فهذا عكس قانون الطلب.",

            "عاشت ايدك! جوابك صح 🔥",
            "ممتاز! كمل هيج 👏",
            "صح عليك 💪",
            "تسلم، جاوبت صح ✅",
            "كلش زين، مسيطر على السؤال 😎",
            "إجابة صحيحة، عاشت إيدك 👌",
            "بطل! كمل 🌟"
        ];
        const msgsWrong = [
            "إجابة غير صحيحة، شوف الشرح جوة 👇",
            "مو هاي، بس لا تزعل، اقرا التوضيح 📖",
            "قربت، ركز بالشرح وراح تثبتها 💡",
            "غلط هالمرة، وتعلمنا منها 🤝",
            "مو صحيحة، راجع التوضيح أدناه 📚",
            "ما صارت، المهم تفهم السبب 👇"
        ];

        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function playSound(type) {
            if (!state.sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.warn("Audio blocked by browser:", e);
            }
        }

        function toggleSound() {
            state.sound = !state.sound;
            const icon = document.getElementById('soundToggle');
            icon.className = state.sound ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            if(state.sound && !audioCtx) {
                try { audioCtx = new AudioContext(); } catch(e){}
            }
        }

        // --- CORE FUNCTIONS ---
        function saveStats() {
            localStorage.setItem('econStats', JSON.stringify(state.stats));
        }

        function switchView(viewId) {
            if (viewHistory[viewHistory.length - 1] !== viewId) {
                viewHistory.push(viewId);
            }
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function goBack() {
            if (viewHistory.length > 1) {
                viewHistory.pop(); // remove current
                const prev = viewHistory[viewHistory.length - 1];
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.getElementById(prev).classList.add('active');
                window.scrollTo(0,0);
            } else {
                goHome(true); // force home
            }
        }

        function goHome(force = false) {
            if (!force && viewHistory[viewHistory.length - 1] === 'quiz-view' && state.questions.length > 0) {
                if (!confirm("متأكد تريد تطلع؟ راح يطير امتحانك الحالي!")) return;
            }
            clearInterval(state.timerInterval);
            document.getElementById('feedback-box').style.display = 'none';
            viewHistory = ['home-view'];
            state.questions = []; // clear current quiz
            renderHome();
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('home-view').classList.add('active');
            window.scrollTo(0,0);
        }

        function renderHome() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';
            CHAPTERS.forEach(chap => {
                const qCount = ALL_QUESTIONS.filter(q => q.chapter === chap.id).length;
                const best = state.stats.bestScores[chap.id] || 0;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => setupQuiz(chap.id);
                card.innerHTML = `
                    <h3>${chap.title}</h3>
                    <div class="stats">
                        <span><i class="fa-solid fa-clipboard-question"></i> ${qCount} سؤال</span>
                        <span style="color:var(--success)"><i class="fa-solid fa-trophy"></i> الأفضل: ${best}%</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupQuiz(chapterId) {
            state.activeChapter = chapterId;
            const title = chapterId === 'all' ? "امتحان شامل" : CHAPTERS.find(c => c.id === chapterId).title;
            document.getElementById('setup-title').innerText = title;
            switchView('quiz-setup-view');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz(wrongOnly = false) {
            state.timerEnabled = document.getElementById('timer-toggle').checked;
            state.shuffleEnabled = document.getElementById('shuffle-toggle').checked;
            
            let qs = [];
            if (wrongOnly) {
                // Collect wrong answers from current state
                qs = state.answers.filter(a => !a.isCorrect).map(a => a.q);
            } else {
                if (state.activeChapter === 'all') qs = [...ALL_QUESTIONS];
                else qs = ALL_QUESTIONS.filter(q => q.chapter === state.activeChapter);
            }

            if (state.shuffleEnabled) qs = shuffleArray(qs);
            
            // Limit to 50 max for all chapters to not exhaust user
            if(state.activeChapter === 'all' && qs.length > 50) qs = qs.slice(0, 50);

            // Pre-process questions to shuffle options if needed
            state.questions = qs.map(q => {
                let opts = q.options.map((text, i) => ({text, isCorrect: i === q.correctIndex}));
                if(state.shuffleEnabled) opts = shuffleArray(opts);
                return {...q, opts};
            });

            state.currentIndex = 0;
            state.answers = [];
            state.streak = 0;
            
            document.getElementById('tools-bar').style.display = 'flex';
            document.getElementById('timer').style.display = state.timerEnabled ? 'block' : 'none';
            
            switchView('quiz-view');
            renderQuestion();
        }

        function renderQuestion() {
            clearInterval(state.timerInterval);
            const q = state.questions[state.currentIndex];
            
            document.getElementById('q-counter').innerText = `السؤال ${state.currentIndex + 1} من ${state.questions.length}`;
            document.getElementById('progress-bar').style.width = `${((state.currentIndex) / state.questions.length) * 100}%`;
            
            // Add ID for context to user
            document.getElementById('question-text').innerHTML = `<span style="color:var(--primary); font-size:0.9rem;">(سؤال ${q.id})</span><br>` + q.question;
            
            const isBookmarked = state.stats.bookmarks.includes(q.id);
            const bBtn = document.getElementById('btn-bookmark');
            bBtn.className = `fa-solid fa-bookmark bookmark-btn ${isBookmarked ? 'active' : ''}`;

            const optsCont = document.getElementById('options-container');
            optsCont.innerHTML = '';
            
            const letters = ['أ', 'ب', 'ج', 'د'];
            q.opts.forEach((opt, idx) => {
                const optEl = document.createElement('div');
                optEl.className = 'option';
                optEl.onclick = () => handleAnswer(idx);
                // Extracting just the text without the old letter
                let cleanText = opt.text.replace(/^[أبجدهـ][.)]\s*/, '');
                
                optEl.innerHTML = `<div class="opt-letter">${letters[idx]}</div> <div>${cleanText}</div>`;
                optsCont.appendChild(optEl);
            });

            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-hint').style.display = 'block';

            // Typeset MathJax safely
            try {
                if(window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById('question-text'), optsCont]).catch(e => console.warn(e));
                }
            } catch (e) {}

            if (state.timerEnabled) {
                state.timeRemaining = 30;
                document.getElementById('timer').innerText = `00:30`;
                state.timerInterval = setInterval(() => {
                    state.timeRemaining--;
                    document.getElementById('timer').innerText = `00:${state.timeRemaining.toString().padStart(2,'0')}`;
                    if(state.timeRemaining <= 0) {
                        clearInterval(state.timerInterval);
                        // Auto fail
                        handleAnswer(-1); // timeout
                    }
                }, 1000);
            }
        }

        function handleAnswer(selectedIndex) {
            clearInterval(state.timerInterval);
            
            const q = state.questions[state.currentIndex];
            const isTimeout = selectedIndex === -1;
            const isCorrect = !isTimeout && q.opts[selectedIndex].isCorrect;
            const actualCorrectIndex = q.opts.findIndex(o => o.isCorrect);

            state.answers.push({
                q: q,
                userAnswer: isTimeout ? null : q.opts[selectedIndex].text,
                isCorrect: isCorrect,
                correctText: q.opts[actualCorrectIndex].text
            });

            const optEls = document.querySelectorAll('.option');
            optEls.forEach(el => el.classList.add('disabled'));

            if (!isTimeout) optEls[selectedIndex].classList.add(isCorrect ? 'correct' : 'wrong');
            optEls[actualCorrectIndex].classList.add('correct'); // always show correct

            const fbBox = document.getElementById('feedback-box');
            const fbTitle = document.getElementById('feedback-title');
            const fbExpl = document.getElementById('feedback-expl');

            // 1) Show title + explanation + next button FIRST (so nothing can block them)
            let titleMsg = '';
            if (isTimeout) {
                titleMsg = "⏰ خلص الوقت!";
            } else if (isCorrect) {
                titleMsg = msgsCorrect[Math.floor(Math.random() * msgsCorrect.length)];
            } else {
                titleMsg = msgsWrong[Math.floor(Math.random() * msgsWrong.length)];
            }

            fbBox.className = `feedback-box ${isCorrect ? 'success' : 'error'}`;
            fbBox.style.display = 'block';
            fbTitle.innerHTML = `<i class="fa-solid fa-${isCorrect ? 'check-circle' : 'circle-xmark'}"></i> ${titleMsg}`;

            // Detailed custom explanation from dict
            let explText = EXPLANATIONS[q.id] || "راجع هذا المبدأ زين حتى ما تغلط بيه بالامتحان.";
            fbExpl.innerHTML = `<b>التوضيح:</b> ${explText}`;

            document.getElementById('btn-next').style.display = 'block';
            document.getElementById('btn-hint').style.display = 'none';

            // 2) Streak + sounds + effects (each protected so a failure can't break the page)
            if (isCorrect) state.streak++; else state.streak = 0;
            try { updateStreakUI(); } catch (e) { console.warn(e); }
            try { playSound(isCorrect ? 'correct' : 'wrong'); } catch (e) { console.warn(e); }
            try { if (isCorrect && state.streak > 2) triggerConfetti(); } catch (e) { console.warn(e); }
            try { if (!isCorrect && navigator.vibrate) navigator.vibrate([50, 50, 50]); } catch (e) {}

            // 3) MathJax for the explanation
            try {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([fbExpl]).catch(e => console.warn(e));
                }
            } catch (e) {}

            // Make sure the explanation is visible on small screens
            try { fbBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
        }

        function updateStreakUI() {
            const sb = document.getElementById('streak-box');
            if (state.streak >= 2) {
                sb.style.display = 'flex';
                document.getElementById('streak-count').innerText = state.streak;
                sb.style.animation = 'none';
                setTimeout(() => sb.style.animation = 'fadeIn 0.3s', 10);
            } else {
                sb.style.display = 'none';
            }
        }

        function showHint() {
            const q = state.questions[state.currentIndex];
            const wrongOptions = q.opts.map((o,i) => ({...o, i})).filter(o => !o.isCorrect);
            if(wrongOptions.length >= 2) {
                // hide two wrong options
                const optEls = document.querySelectorAll('.option');
                optEls[wrongOptions[0].i].style.opacity = '0.3';
                optEls[wrongOptions[0].i].classList.add('disabled');
                optEls[wrongOptions[1].i].style.opacity = '0.3';
                optEls[wrongOptions[1].i].classList.add('disabled');
            }
            document.getElementById('btn-hint').style.display = 'none';
        }

        function nextQuestion() {
            state.currentIndex++;
            if (state.currentIndex < state.questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function triggerConfetti() {
            try {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } catch(e){}
        }

        function toggleBookmark() {
            const qId = state.questions[state.currentIndex].id;
            const idx = state.stats.bookmarks.indexOf(qId);
            if(idx > -1) state.stats.bookmarks.splice(idx, 1);
            else state.stats.bookmarks.push(qId);
            
            saveStats();
            const bBtn = document.getElementById('btn-bookmark');
            bBtn.classList.toggle('active');
        }

        function showResult() {
            const correctCount = state.answers.filter(a => a.isCorrect).length;
            const total = state.questions.length;
            const percent = Math.round((correctCount / total) * 100);

            // Update best score
            if (state.activeChapter !== 'all') {
                const currBest = state.stats.bestScores[state.activeChapter] || 0;
                if (percent > currBest) {
                    state.stats.bestScores[state.activeChapter] = percent;
                    saveStats();
                }
            }

            // Pass mark = 50%.  Below it = fail (no praise), then Iraqi grade names above it.
            const RANKS = [
                { max: 19,  pass: false, rank: "راسب - لازم تبدي من الأساسيات 📚",
                  descs: ["لا تزعل، هاي أول محاولة. اقرا الشروحات زين وارجع جرب مرة ثانية.",
                          "النتيجة هالمرة ضعيفة، بس بالمراجعة الصحيحة تتحسن بسرعة. ابدأ من الفصل الأول."] },
                { max: 34,  pass: false, rank: "راسب - تحتاج مراجعة جدية 📖",
                  descs: ["لسه بعيد عن النجاح، بس الحل بسيط: راجع الأسئلة الغلط وافهم شرحها.",
                          "ركز على الأسئلة اللي غلطت بيها وارجع جرب، التحسن يبين بسرعة."] },
                { max: 49,  pass: false, rank: "راسب بفارق بسيط 😬",
                  descs: ["كلش قريب من النجاح! شوية مراجعة للأخطاء وتعدي إن شاء الله.",
                          "ناقصك شوية بس. راجع الأسئلة الغلط وجرب مرة ثانية."] },
                { max: 59,  pass: true,  rank: "مقبول - ناجح بالدعوات 🤲",
                  descs: ["نجحت، بس على الحافة. شوية مراجعة وتطلع بدرجة أحسن.",
                          "عديت الحد الأدنى، بس تكدر تجيب أعلى بكثير."] },
                { max: 69,  pass: true,  rank: "متوسط - طالب مثابر 📖",
                  descs: ["نتيجة زينة، كمل مراجعة وراح تتحسن أكثر.",
                          "على الطريق الصحيح، ركز على الأسئلة اللي غلطت بيها."] },
                { max: 79,  pass: true,  rank: "جيد 👍",
                  descs: ["عاشت ايدك، مستواك زين. شوية تفاصيل وتوصل للامتياز.",
                          "نتيجة حلوة، باقي لك شوية وتصير ممتاز."] },
                { max: 89,  pass: true,  rank: "جيد جداً - وحش الدفعة 🔥",
                  descs: ["أداء كلش قوي، عاشت ايدك!",
                          "مسيطر على المادة تقريباً، شد حيلك على الباقي."] },
                { max: 100, pass: true,  rank: "امتياز - عبقري الزمان 👑",
                  descs: ["ما شاء الله، نتيجة ممتازة! تستاهل التهنئة.",
                          "مستوى عالي جداً، استمر هيج."] }
            ];
            const tier = RANKS.find(r => percent <= r.max) || RANKS[RANKS.length - 1];
            const rank = tier.rank;
            const desc = tier.descs[Math.floor(Math.random() * tier.descs.length)];
            if (percent >= 90) { triggerConfetti(); setTimeout(triggerConfetti, 1000); }

            // Visual cue: red when failed, blue when passed
            const ringColor = tier.pass ? 'var(--primary)' : 'var(--danger)';
            document.getElementById('rank-title').style.color = tier.pass ? 'var(--warning)' : 'var(--danger)';

            document.getElementById('score-percent').innerText = `${percent}%`;
            document.getElementById('score-circle').style.background = `conic-gradient(${ringColor} ${percent}%, var(--border) ${percent}%)`;
            document.getElementById('rank-title').innerText = rank;
            document.getElementById('rank-desc').innerText = desc;
            document.getElementById('stat-correct').innerText = correctCount;
            document.getElementById('stat-wrong').innerText = total - correctCount;

            const retryWrongBtn = document.getElementById('btn-retry-wrong');
            retryWrongBtn.style.display = (correctCount < total) ? 'block' : 'none';

            switchView('result-view');
        }

        function retryWrong() {
            startQuiz(true);
        }

        function shareResult() {
            const correct = state.answers.filter(a => a.isCorrect).length;
            const total = state.questions.length;
            const percent = Math.round((correct / total) * 100);
            const rank = document.getElementById('rank-title').innerText;
            const text = `جبت ${percent}% (${correct}/${total}) باختبار الاقتصاد!\nاللقب: ${rank}\nجرب تختبر نفسك بمنصة الاقتصاد الذكية 🔥`;
            
            if (navigator.share) {
                navigator.share({ title: 'نتيجتي باختبار الاقتصاد', text: text }).catch(e=>console.warn(e));
            } else {
                navigator.clipboard.writeText(text).catch(e=>console.warn(e));
                alert("تم نسخ النتيجة للحافظة!");
            }
        }

        function showReview() {
            document.getElementById('filter-wrong-cb').checked = false;
            renderReview();
            switchView('review-view');
        }

        function renderReview() {
            const list = document.getElementById('review-list');
            const onlyWrong = document.getElementById('filter-wrong-cb').checked;
            list.innerHTML = '';

            state.answers.forEach((ans, i) => {
                if (onlyWrong && ans.isCorrect) return;

                let uAnsClean = ans.userAnswer ? ans.userAnswer.replace(/^[أبجدهـ][.)]\s*/, '') : 'لم تتم الإجابة';
                let cAnsClean = ans.correctText.replace(/^[أبجدهـ][.)]\s*/, '');
                let explText = EXPLANATIONS[ans.q.id] || "شرح غير متوفر حالياً.";

                const el = document.createElement('div');
                el.className = `review-item ${ans.isCorrect ? '' : 'wrong'}`;
                el.innerHTML = `
                    <div class="review-q">Q${ans.q.id}: ${ans.q.question}</div>
                    <div class="review-ans ${ans.isCorrect ? 'correct-text' : 'wrong-text'}">إجابتك: ${uAnsClean}</div>
                    ${!ans.isCorrect ? `<div class="review-ans correct-text">الصح: ${cAnsClean}</div>` : ''}
                    <div style="margin-top:10px; font-size:0.9rem; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
                        <b>التوضيح:</b> ${explText}
                    </div>
                `;
                list.appendChild(el);
            });
            
            try {
                if(window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([list]).catch(e=>console.warn(e));
                }
            } catch(e){}
        }

        function showBookmarks() {
            const list = document.getElementById('bookmarks-list');
            list.innerHTML = '';
            
            if(state.stats.bookmarks.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">ماكو أي سؤال محفوظ حالياً.</div>';
            } else {
                state.stats.bookmarks.forEach((bId, idx) => {
                    const q = ALL_QUESTIONS.find(xq => xq.id === bId);
                    if(!q) return;
                    
                    const cAnsClean = q.options[q.correctIndex].replace(/^[أبجدهـ][.)]\s*/, '');
                    let explText = EXPLANATIONS[q.id] || "شرح غير متوفر حالياً.";
                    
                    const el = document.createElement('div');
                    el.className = `review-item`;
                    el.style.borderLeftColor = 'var(--warning)';
                    el.innerHTML = `
                        <div style="display:flex; justify-content:space-between;">
                            <span style="font-size:0.8rem; color:var(--text-muted)">الفصل ${q.chapter} - سؤال ${q.id}</span>
                            <i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="removeBookmark(${q.id})"></i>
                        </div>
                        <div class="review-q" style="margin-top:10px;">${q.question}</div>
                        <div class="review-ans correct-text">الجواب: ${cAnsClean}</div>
                        <div style="margin-top:10px; font-size:0.9rem; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
                            <b>التوضيح:</b> ${explText}
                        </div>
                    `;
                    list.appendChild(el);
                });
            }
            
            try {
                if(window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([list]).catch(e=>console.warn(e));
                }
            } catch(e){}
            switchView('bookmarks-view');
        }

        function removeBookmark(id) {
            const idx = state.stats.bookmarks.indexOf(id);
            if(idx > -1) state.stats.bookmarks.splice(idx, 1);
            saveStats();
            showBookmarks(); // re-render
        }

        // Init
        window.onload = () => {
            renderHome();
        };

    </script>
</body>
</html>
